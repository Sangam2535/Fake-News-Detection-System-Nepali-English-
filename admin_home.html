<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - FakeDetect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #f5f7fb; color: #333; }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #ffffff; padding: 15px 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: fixed; width: 100%; top: 0; z-index: 10;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background-color: #2563eb; color: #fff; font-weight: 700; font-size: 20px; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(37,99,235,0.4); }
    .logo span { font-size: 20px; font-weight: 600; color: #1e3a8a; letter-spacing: 0.5px; }

    /* Sidebar */
    .nav {
      position: fixed; left: 0; top: 70px; height: calc(100vh - 70px);
      width: 230px; background-color: #2f2f2f; display: flex; flex-direction: column; align-items: flex-start;
      padding: 25px 0; gap: 10px; box-shadow: 2px 0 8px rgba(0,0,0,0.15);
    }

    .nav a {
      width: 100%; text-decoration: none; color: #e5e5e5; font-weight: 500; padding: 12px 25px; border-left: 4px solid transparent; transition: all 0.3s ease;
    }

    .nav a:hover { background-color: #444444; color: #fff; border-left: 4px solid #fff; }
    .nav a.logout { margin-top: auto; background-color: #ef4444; color: #fff; font-weight: 600; border-left: none; border-top: 1px solid rgba(255,255,255,0.2); }
    .nav a.logout:hover { background-color: #dc2626; }

    /* Content area */
    .content { margin-left: 250px; margin-top: 80px; padding: 30px; }

    /* Dashboard cards */
    .cards { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
    .card {
      background: #fff; padding: 20px; flex: 1; min-width: 200px;
      border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;
    }
    .card h2 { margin-bottom: 10px; font-size: 1.2em; color: #2563eb; }
    .card p { font-size: 2em; font-weight: 600; color: #1e3a8a; }

    /* Chart container */
    .chart-container {
      background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 40px;
      max-width: 600px; margin-left: auto; margin-right: auto;
    }
    canvas { display: block; width: 100% !important; height: auto !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">FD</div>
      <span>FakeDetect</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="nav">
    <a href="{{ url_for('admin_home') }}">Home</a>
    <a href="{{ url_for('add_URLs') }}">Add URLs</a>
    <a href="{{ url_for('users_page') }}">Users</a>
    <a href="{{ url_for('insert_news_page') }}">Insert News</a>
    <a href="{{ url_for('newsportals') }}">News Portal</a>
    <a href="{{ url_for('news') }}">News</a>
    <a href="{{ url_for('logout') }}" class="logout">Log Out</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h1>Admin Dashboard</h1>

    <!-- Cards -->
    <div class="cards">
      <div class="card">
        <h2>Total Users</h2>
        <p>{{ user_count }}</p>
      </div>
      <div class="card">
        <h2>Total News Portals</h2>
        <p>{{ portal_count }}</p>
      </div>
    </div>

    <!-- Pie Chart -->
    <div class="chart-container">
      <h2>News Categories Distribution</h2>
      <canvas id="categoryChart" width="400" height="400"></canvas>
    </div>
  </div>

  <!-- Chart.js Script -->
  <script>
    const ctx = document.getElementById('categoryChart').getContext('2d');
    const categoryChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: {{ categories | tojson }},
        datasets: [{
          label: 'News by Category',
          data: {{ category_counts | tojson }},
          backgroundColor: [
            '#2563eb', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899', '#0ea5e9'
          ],
          borderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true, // ensures pie is circular
        plugins: {
          legend: { position: 'bottom' },
          title: { display: true, text: 'News Distribution by Category' }
        }
      }
    });
  </script>
</body>
</html>
